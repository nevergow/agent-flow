<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Flow</title>
<style>
  :root{
    --bg:#090c11; --bg2:#0b1017; --card:#111823; --card2:#0e141d;
    --line:rgba(148,163,184,.13); --line2:rgba(148,163,184,.07);
    --text:#e2e8f0; --muted:#8896a8; --dim:#5b6a7d;
    --human:#cbd5e1; --orch:#a78bfa; --dsh:#22d3ee; --pi:#34d399;
    --pirpc:#2dd4bf; --codex:#fb923c; --sub:#7dd3fc; --proj:#94a3b8;
    --active:#22d3ee; --wait:#fbbf24; --idle:#475569;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font:12.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  /* 点阵背景（React Flow 风格） */
  #grid{position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(148,163,184,.16) 1px, transparent 1px);
    background-size:26px 26px;opacity:.5;
    mask-image:radial-gradient(ellipse at 50% 45%, #000 40%, transparent 100%)}
  #vign{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(1200px 700px at 50% 0%, rgba(34,211,238,.05), transparent 60%)}

  header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:16px;
    padding:0 18px;border-bottom:1px solid var(--line2);background:rgba(9,12,17,.82);
    backdrop-filter:blur(12px);z-index:6}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#22d3ee,#6366f1);
    box-shadow:0 0 14px rgba(34,211,238,.35)}
  .brand b{font-size:13px;letter-spacing:.02em}
  .brand span{color:var(--dim);font-size:11px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;
    padding:3px 8px;border:1px solid var(--line);border-radius:999px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--active);box-shadow:0 0 8px var(--active);
    animation:blink 2s infinite}
  .live.replay i{background:var(--wait);box-shadow:0 0 8px var(--wait);animation:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .stats{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:11px;
    font-variant-numeric:tabular-nums}
  .stats b{color:var(--text);font-weight:600;font-size:12px;margin-left:4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);font-size:11px;padding:5px 9px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:rgba(34,211,238,.14);color:#a5f3fc}

  #stage{position:fixed;top:52px;left:0;right:0;bottom:86px}
  #edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .edge-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
  .edge-line{fill:none}
  .edge-label{font-size:10.5px;fill:#9fb2c6;font-family:-apple-system,"PingFang SC",sans-serif}
  .edge-pill{fill:#0c1219;stroke:rgba(34,211,238,.28);rx:7}
  .flow{animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-18}}

  #nodes{position:absolute;inset:0}
  .lane{position:absolute;top:10px;transform:translateX(-50%);font-size:9px;letter-spacing:.16em;
    color:rgba(148,163,184,.55);white-space:nowrap;z-index:2}
  .band{position:absolute;top:34px;bottom:96px;border-radius:14px;background:rgba(148,163,184,.028);
    border:1px solid rgba(148,163,184,.05)}
  #brief{position:absolute;left:18px;top:38px;width:286px;z-index:3;background:rgba(13,18,25,.9);
    border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  #brief h4{margin:0 0 6px;font-size:9px;letter-spacing:.14em;color:rgba(148,163,184,.6);font-weight:500}
  #brief .item{display:flex;align-items:baseline;gap:7px;margin:4px 0;font-size:11px}
  #brief .item .nm{color:var(--text);font-weight:600}
  #brief .item .st{color:var(--active)}
  #brief .item .meta{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  #brief .empty{color:var(--dim);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 底部甘特 */
  #gantt{position:absolute;left:18px;right:18px;bottom:6px;height:118px;border-top:1px solid var(--line2);
    padding-top:7px}
  #gantt .gt{font-size:9px;letter-spacing:.14em;color:rgba(148,163,184,.55);margin-bottom:5px}
  .grow{position:relative;height:15px;margin:2px 0}
  .glabel{position:absolute;left:0;top:2px;width:58px;font-size:9px;color:var(--dim);letter-spacing:.02em}
  .gbar{position:absolute;top:1px;height:13px;border-radius:3px;cursor:pointer;font-size:8.5px;
    color:#04121a;overflow:hidden;white-space:nowrap;padding:0 4px;opacity:.92}
  .gaxis{position:relative;height:14px;margin:4px 0 0 58px;font-size:8.5px;color:var(--dim)}
  .pool{position:absolute;bottom:10px;height:64px;border:1px dashed rgba(148,163,184,.16);
    border-radius:12px;background:#0a0f16}
  .pool .plabel{position:absolute;left:12px;top:-8px;padding:0 6px;background:var(--bg);
    font-size:9px;letter-spacing:.14em;color:rgba(148,163,184,.5)}
  .card{position:absolute;min-height:78px;padding:10px 11px 12px;border-radius:12px;
    background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(-50%,-50%);cursor:pointer;
    transition:border-color .15s,box-shadow .15s,transform .15s}
  .card.mini{min-height:46px;padding:7px 10px;border-radius:10px;opacity:.92}
  .card.mini .sub,.card.mini .metrics{display:none}
  .card.mini .load{display:none}
  .card:hover{border-color:rgba(148,163,184,.3);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .card.sel{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 1px rgba(34,211,238,.35),0 10px 30px rgba(0,0,0,.5)}
  .card .accent{position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px}
  .card .row1{display:flex;align-items:center;gap:7px;padding-left:6px}
  .card .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .pill{font-size:9px;letter-spacing:.07em;padding:1px 6px;border-radius:999px;border:1px solid currentColor;
    white-space:nowrap}
  .pill.run{color:var(--active)} .pill.wait{color:var(--wait)} .pill.idle{color:var(--idle)}
  .card .sub{padding-left:6px;margin-top:2px;color:var(--muted);font-size:10.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .card .metrics{display:flex;gap:9px;padding-left:6px;margin-top:5px;color:var(--dim);font-size:10px;
    font-variant-numeric:tabular-nums}
  .card .metrics span{white-space:nowrap}
  .card .load{position:absolute;left:10px;right:10px;bottom:6px;height:3px;border-radius:3px;
    background:rgba(148,163,184,.10);overflow:hidden}
  .card .load i{display:block;height:100%;border-radius:3px;transition:width .5s;opacity:.85}
  .card.busy{box-shadow:0 8px 28px rgba(0,0,0,.4),0 0 22px -4px var(--glow,rgba(34,211,238,.5))}
  .card .ev{position:absolute;right:8px;top:-7px;font-size:8.5px;letter-spacing:.04em;color:var(--dim);
    background:#0a0f16;border:1px solid var(--line);border-radius:5px;padding:1px 4px}
  .card.waiting::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;
    background:var(--wait);box-shadow:0 0 8px var(--wait);animation:blink 1.6s infinite}

  /* 回放条 */
  #replaybar{position:fixed;left:0;right:0;bottom:0;height:86px;display:flex;align-items:center;gap:16px;
    padding:0 20px;border-top:1px solid var(--line2);background:#080c11;z-index:6}
  #replaybar .title{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;width:76px}
  .scrub-wrap{flex:1;position:relative}
  .scrub-ticks{display:flex;justify-content:space-between;margin-top:3px;color:var(--dim);font-size:9px;
    letter-spacing:.04em}
  #scrub{width:100%;-webkit-appearance:none;height:14px;border-radius:3px;outline:none;background:
    linear-gradient(rgba(148,163,184,.22),rgba(148,163,184,.22)) center/100% 3px no-repeat,
    repeating-linear-gradient(to right, rgba(148,163,184,.38) 0 1px, transparent 1px 20%) center/100% 12px no-repeat}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.7);cursor:pointer}
  #scrub:disabled::-webkit-slider-thumb{background:#475569;box-shadow:none}
  .rp-time{color:var(--text);font-variant-numeric:tabular-nums;font-size:12px;width:132px;text-align:right}
  .btn{background:rgba(148,163,184,.08);border:1px solid var(--line);color:var(--text);border-radius:6px;
    padding:5px 10px;font-size:11px;cursor:pointer}
  .btn:hover{background:rgba(148,163,184,.14)}
  .btn.primary{border-color:rgba(34,211,238,.4);color:#a5f3fc;background:rgba(34,211,238,.1)}
  .btn[disabled]{opacity:.4;cursor:default}

  /* 图例 */
  #legend{position:fixed;left:18px;bottom:232px;display:flex;flex-direction:column;gap:5px;
    color:var(--muted);font-size:11px;z-index:5}
  #legend div{display:flex;align-items:center;gap:7px}
  #legend i{width:8px;height:8px;border-radius:2px}
  #legend .ln{width:18px;height:0;border-top:1.5px solid}

  /* 详情面板 */
  #panel{position:fixed;top:52px;right:0;bottom:86px;width:372px;background:rgba(12,17,24,.96);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s ease;
    overflow-y:auto;padding:18px;backdrop-filter:blur(14px);z-index:7}
  #panel.open{transform:none}
  #panel h2{margin:0 0 2px;font-size:15px}
  #panel .sub{color:var(--muted);font-size:11px;margin-bottom:14px}
  #panel .close{position:absolute;right:14px;top:12px;color:var(--muted);cursor:pointer;font-size:17px}
  .kv{display:flex;margin:7px 0;font-size:11.5px}
  .kv .k{color:var(--dim);width:74px;flex:none}
  .kv .v{color:var(--text);word-break:break-all}
  .sect{margin:16px 0 6px;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
  pre{background:#070a0f;border:1px solid var(--line);border-radius:7px;padding:8px;margin:6px 0;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9db2c8;white-space:pre-wrap;
    word-break:break-all;cursor:pointer}
  .taskbox{background:#070a0f;border:1px solid var(--line);border-radius:8px;padding:10px;
    font-size:11.5px;color:#b7c6d8;white-space:pre-wrap;max-height:180px;overflow:auto}
  .chip{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);margin-right:5px}
  .chip.reg{color:#86efac;border-color:rgba(134,239,172,.35)}
  .chip.inf{color:#fca5a5;border-color:rgba(252,165,165,.3)}

  #tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity .12s;
    background:#0c131b;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:11px;
    max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #err{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#3b1116;color:#fca5a5;
    border:1px solid #7f1d1d;border-radius:6px;padding:6px 10px;font:11px ui-monospace,Menlo,monospace;
    display:none;z-index:20;max-width:80vw}
</style>
</head>
<body>
<div id="grid"></div><div id="vign"></div>

<header>
  <div class="brand"><div class="mark"></div><b>Agent Flow</b><span>谁在干活 · 活从哪来到哪去</span></div>
  <div class="live" id="live"><i></i><span id="live-txt">LIVE</span></div>
  <div class="stats">
    <span>在跑任务<b id="s-active">0</b></span>
    <span>近5分钟<b id="s-tok">0</b></span>
    <span>花费<b id="s-cost">¥0</b></span>
  </div>
  <div class="seg" id="wins"></div>
</header>

<div id="stage">
  <svg id="edges"></svg>
  <div id="nodes"></div>
</div>

<div id="legend">
  <div><i style="background:var(--active)"></i>正在跑（流线 + 粒子）</div>
  <div><i style="background:var(--wait)"></i>跑完了，等我验收</div>
  <div><i style="background:#475569"></i>窗口内已结束</div>
  <div><span class="ln" style="border-color:#64748b"></span>派活：单向，同两点可多条</div>
</div>

<div id="replaybar">
  <div class="title">时间回放</div>
  <button class="btn primary" id="btn-live">回到实时</button>
  <button class="btn" id="btn-play">▶ 播放</button>
  <div class="scrub-wrap">
    <input type="range" id="scrub" min="0" max="1000" value="1000" disabled>
    <div class="scrub-ticks"><span>24h 前</span><span>12h</span><span>6h</span><span>现在</span></div>
  </div>
  <div class="rp-time" id="rp-time">实时</div>
</div>

<aside id="panel"><span class="close" id="p-close">×</span><h2 id="p-title"></h2><div class="sub" id="p-sub"></div><div id="p-body"></div></aside>
<div id="tip"></div>
<div id="err"></div>

<script>
const COLOR = {
  human:"#cbd5e1", orchestrator:"#a78bfa", project:"#94a3b8",
  dsh:"#22d3ee", pi:"#34d399", "pi-rpc":"#2dd4bf", codex:"#f472b6", subagent:"#7dd3fc"
};
const NODE_W = { human:150, orchestrator:196, worker:172, project:150 };
const STATE_COLOR = { active:"#22d3ee", waiting:"#fbbf24", recent:"#64748b" };

const svg = document.getElementById("edges");
const nodeLayer = document.getElementById("nodes");
const tip = document.getElementById("tip");
const errBox = document.getElementById("err");
window.onerror = (m, s, l) => { errBox.style.display = "block"; errBox.textContent = m + " @" + l; };

let state = null, nodes = [], edges = [], mode = "live", windowMin = 15;
let selected = null, hover = null, replayT = null, playing = false, playTimer = null;
let newNodeIds = new Set();
const STATIC = new URLSearchParams(location.search).has("static");

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtTok(n){ n = n||0; return n<1000?String(n):n<1e6?(n/1000).toFixed(1)+"k":(n/1e6).toFixed(2)+"M"; }
function fmtCost(c){ c = c||0; return c<0.005?"¥0":c<1?"¥"+c.toFixed(2):"¥"+c.toFixed(1); }
function fmtDur(ms){ const s=Math.max(0,Math.round(ms/1000));
  return s<60?s+"s":s<3600?Math.floor(s/60)+"m"+String(s%60).padStart(2,"0")+"s":Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0"); }
function ago(ts){ const s=Date.now()/1000-ts; return s<60?Math.round(s)+"s":s<3600?Math.round(s/60)+"m":Math.round(s/3600)+"h"; }

/* ---------------- 布局 ---------------- */
const COL_X = [0.105, 0.305, 0.545, 0.885];
const LANES = ["指令 INGRESS", "编排 ORCHESTRATOR", "执行者 WORKERS", "工作区 WORKSPACE"];
let poolBox = null;
function layout(){
  if(!state) return;
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  const topoH = H - 128;
  const midY = topoH * 0.50;
  const byLayer = {};
  state.nodes.forEach(n => (byLayer[n.layer] = byLayer[n.layer] || []).push(n));
  const workers = byLayer[2] || [];
  const waitingIds = new Set(state.edges.filter(e => e.state === "waiting").map(e => e.to));
  const busyW = workers.filter(n => n.sessions > 0 || (n.busy||0) > 0.3 || waitingIds.has(n.id));
  const idleW = workers.filter(n => !(n.sessions > 0 || (n.busy||0) > 0.3 || waitingIds.has(n.id)));
  nodes = [];

  [0,1].forEach(L => {
    const arr = byLayer[L] || [], n = arr.length;
    const step = n > 1 ? Math.min(120, (topoH-150)/n) : 0;
    const y0 = midY - (step*(n-1))/2;
    arr.forEach((nd,i) => nodes.push({...nd, x: W*COL_X[L], y: y0 + step*i, w: NODE_W[nd.role]||172, mini:false}));
  });

  const n2 = busyW.length, step2 = n2 > 1 ? Math.min(132, (topoH-170)/n2) : 0;
  const y02 = midY - 6 - (step2*(n2-1))/2;
  busyW.forEach((nd,i) => nodes.push({...nd, x: W*COL_X[2], y: y02 + step2*i, w: 186, mini:false}));

  const poolX = W * 0.715, poolStep = 56;
  const nIdle = idleW.length;
  const poolTop = midY - ((nIdle-1)*poolStep)/2;
  idleW.forEach((nd,i) => nodes.push({...nd, x: poolX, y: poolTop + i*poolStep, w: 188, mini:true}));
  poolBox = nIdle ? {x: poolX, top: poolTop - 34, bottom: poolTop + (nIdle-1)*poolStep + 28} : null;

  const projs = byLayer[3] || [], n3 = projs.length;
  const step3 = n3 > 1 ? Math.min(108, (topoH-170)/n3) : 0;
  const y03 = midY - (step3*(n3-1))/2;
  projs.forEach((nd,i) => nodes.push({...nd, x: W*COL_X[3], y: y03 + step3*i, w: 176, mini:false}));

  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  edges = state.edges.map((e, i) => {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b) return null;
    const group = state.edges.filter(x => x.from === e.from && x.to === e.to);
    const gi = group.indexOf(e), gn = group.length;
    const off = Math.max(-40, Math.min(40, (gi - (gn-1)/2) * 14));
    return { ...e, a, b, off, i };
  }).filter(Boolean);
}

/* ---------------- 渲染 ---------------- */
function render(){
  if(!state) return;
  layout();
  renderEdges();
  renderNodes();
  document.getElementById("s-active").textContent = state.counts.active_tasks;
  document.getElementById("s-tok").textContent = fmtTok(state.counts.tokens_5m);
  document.getElementById("s-cost").textContent = fmtCost(state.counts.cost_today);
  document.getElementById("live-txt").textContent = mode === "live" ? "LIVE" : "回放";
  document.getElementById("live").classList.toggle("replay", mode !== "live");
  if(selected) renderPanel();
}

function edgeCtrl(e){
  const x1 = e.a.x + e.a.w/2 + 2, y1 = e.a.y + e.off;
  const x2 = e.b.x - e.b.w/2 - 7, y2 = e.b.y + e.off;
  const dx = Math.max(40, Math.abs(x2 - x1) * 0.42);
  // 避障：从执行者去工作区的线如果会穿过待命池，就向下绕到池子底部之外
  let lift = 0;
  if(e.to.startsWith("proj:") && poolBox && y1 > poolBox.top - 24 && y1 < poolBox.bottom + 24)
    lift = Math.min(190, Math.max(60, (poolBox.bottom - y1) + 52));
  return { x1, y1, x2, y2, c1x: x1 + dx, c1y: y1 + lift, c2x: x2 - dx, c2y: y2 + lift };
}
function edgePath(e){
  const c = edgeCtrl(e);
  return `M${c.x1},${c.y1} C${c.c1x},${c.c1y} ${c.c2x},${c.c2y} ${c.x2},${c.y2}`;
}
function textW(s, fs){
  let w = 0;
  for(const ch of s) w += /[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? fs : fs*0.56;
  return w;
}

function renderEdges(){
  const defs = `
  <defs>
    <marker id="ar-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ar-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/></marker>
    <marker id="ar-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  </defs>`;
  let html = defs;
  edges.forEach(e => {
    const st = e.state, c = STATE_COLOR[st] || "#64748b";
    const d = edgePath(e);
    const hot = hover && hover.type === "edge" && hover.id === e.id;
    const sel = selected && selected.type === "edge" && selected.id === e.id;
    const strong = st === "active" || st === "waiting";
    const w = hot || sel ? 2.6 : strong ? 2.0 : 1.2;
    const op = strong ? (st === "active" ? .95 : .8) : .4;
    html += `<path class="edge-hit" d="${d}" data-edge="${esc(e.id)}"/>`;
    html += `<path class="edge-line ${st==='active'?'flow':''}" d="${d}" stroke="${c}" stroke-width="${w}"
      stroke-opacity="${op}" stroke-dasharray="${st==='active'?'6 6':'0'}"
      marker-end="url(#ar-${st==='active'?'active':st==='waiting'?'wait':'idle'})"/>`;
    if(st !== "recent" || hot || sel){
      const p = bezierPoint(e, 0.5);
      const raw = e.label || "";
      const label = raw.length > 26 ? raw.slice(0, 26) + "…" : raw;
      if(label){
        const wpx = Math.min(320, textW(label, 10.5) + 14);
        const bx = p.x - wpx/2, by = p.y - 19;
        html += `<g><rect class="edge-pill" x="${bx}" y="${by}" width="${wpx}" height="16" rx="7"/>
          <text class="edge-label" x="${bx + 7}" y="${by + 11.5}">${esc(label)}</text></g>`;
      }
    }
    if(st === "active" && !STATIC){
      for(let k=0;k<3;k++) html += `<circle class="dot" data-edge="${esc(e.id)}" r="3" fill="#c8f7ff" opacity=".9"/>`;
    }
  });
  svg.innerHTML = html;
  bindEdgeEvents();
  if(!STATIC) startParticles();
}

function bezierPoint(e, t){
  const c = edgeCtrl(e);
  const u = 1 - t;
  return {
    x: u*u*u*c.x1 + 3*u*u*t*c.c1x + 3*u*t*t*c.c2x + t*t*t*c.x2,
    y: u*u*u*c.y1 + 3*u*u*t*c.c1y + 3*u*t*t*c.c2y + t*t*t*c.y2
  };
}
function startParticles(){
  document.querySelectorAll(".dot").forEach((dot, idx) => {
    const e = edges.find(x => x.id === dot.dataset.edge);
    if(!e) return;
    dot._edge = e; dot._phase = (idx % 3) / 3;
  });
  if(!window._raf){ window._raf = requestAnimationFrame(tickParticles); }
}
function tickParticles(now){
  const t = now / 1000;
  document.querySelectorAll(".dot").forEach(dot => {
    const e = dot._edge; if(!e) return;
    const speed = 0.35 + Math.min(0.4, (e.tokens_recent||0)/400000);
    const p = ((t * speed + (dot._phase||0)) % 1);
    const pt = bezierPoint(e, p);
    dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
  });
  window._raf = requestAnimationFrame(tickParticles);
}

function renderNodes(){
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  let html = "";
  const bandW = [210, 250, 230, 220];
  [0,1,2,3].forEach(L => { html += `<div class="band" style="left:${W*COL_X[L]-bandW[L]/2}px;width:${bandW[L]}px;top:30px;bottom:134px"></div>`; });
  [0,1,2,3].forEach(L => { html += `<div class="lane" style="left:${W*COL_X[L]}px">${LANES[L]}</div>`; });
  html += `<div class="lane" style="left:${W*0.715}px">待命 IDLE</div>`;

  const live = edges.filter(e => e.kind === "dispatch" && (e.state === "active" || e.state === "waiting"));
  html += `<div id="brief"><h4>此刻</h4>` + (live.length ? live.slice(0,3).map(e => {
    const n = nodes.find(x => x.id === e.to);
    const el = (state.generated_at - (e.started_at || state.generated_at)) * 1000;
    const tag = e.state === "active" ? "在跑" : "待验收";
    return `<div class="item"><span class="nm">${esc(n ? n.label.replace(" headless","") : "")}</span>
      <span class="st" style="color:${e.state==='active'?'var(--active)':'var(--wait)'}">${tag}</span>
      <span class="meta">${fmtDur(el)} · ${fmtCost(e.cost)}</span></div>
      <div class="item"><span class="empty">${esc((e.label||"").slice(0,36))}</span></div>`;
  }).join("") : `<div class="empty">没有任务在跑，也没有待验收的</div>`) + `</div>`;

  if(poolBox)
    html += `<div class="pool" style="left:${poolBox.x-98}px;width:196px;top:${poolBox.top}px;height:${poolBox.bottom-poolBox.top}px;bottom:auto"><div class="plabel">随时可派</div></div>`;

  html += nodes.map(n => {
    const c = COLOR[n.id] || (n.role === "worker" ? "#22d3ee" : "#94a3b8");
    const busy = Math.max(0, Math.min(1, n.busy || 0));
    const waiting = edges.some(e => e.to === n.id && e.state === "waiting");
    const pillState = n.role === "orchestrator"
      ? (n.busy > .5 ? ["ACTIVE","run"] : ["IDLE","idle"])
      : n.sessions > 0 ? ["RUN","run"] : waiting ? ["WAIT","wait"] : ["IDLE","idle"];
    const showPill = n.role === "worker" || n.role === "orchestrator";
    const metrics = [];
    if(n.sessions) metrics.push(`${n.sessions} 会话`);
    if(n.tokens_recent) metrics.push(`${fmtTok(n.tokens_recent)} tok`);
    if(n.cost_window) metrics.push(fmtCost(n.cost_window));
    if(n.role === "project"){ metrics.length = 0; metrics.push(`${n.sessions||0} 运行`); }
    const sub = n.stage ? `${n.stage}${n.note ? " · " + n.note : ""}` : (n.note || "");
    return `<div class="card ${busy>.25&&!n.mini?'busy':''} ${n.mini?'mini':''} ${selected&&selected.id===n.id?'sel':''} ${waiting?'waiting':''}"
      data-node="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;--glow:${c}66">
      <div class="accent" style="background:${c};top:${n.mini?8:10}px;bottom:${n.mini?8:12}px"></div>
      <div class="row1"><span class="name">${esc(n.label)}</span>
        ${showPill?`<span class="pill ${pillState[1]}">${pillState[0]}</span>`:""}</div>
      ${n.mini?"":`<div class="sub">${esc(sub)}</div>
      <div class="metrics">${(metrics.length?metrics:["—"]).map(m=>`<span>${esc(m)}</span>`).join("")}</div>
      <div class="load"><i style="width:${Math.round(busy*100)}%;background:${c}"></i></div>`}
    </div>`;
  }).join("");

  html += renderGantt(W);
  nodeLayer.innerHTML = html;
  bindNodeEvents();
  nodeLayer.querySelectorAll(".gbar").forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const e = edges.find(x => x.key === el.dataset.key);
      if(e){ selected = {type:"edge", id:e.id}; openPanel(); }
    };
  });
}

function renderGantt(W){
  const now = state.generated_at * 1000, span = windowMin*60*1000, from = now - span;
  const avail = Math.max(120, W - 36 - 58 - 12);
  const lanes = ["dsh","pi","pi-rpc","codex","subagent"];
  let html = `<div id="gantt"><div class="gt">最近 ${windowMin} 分钟 · 每条 = 一次派活（点条看详情）</div>`;
  lanes.forEach(l => {
    html += `<div class="grow"><div class="glabel">${l}</div>`;
    (state.timeline || []).filter(t => t.kind === l).forEach(t => {
      const s = Math.max(from, (t.start||0)*1000);
      const e2 = Math.min(now, Math.max((t.start||0)*1000 + 4000, (t.end||0)*1000));
      const left = 58 + (s - from)/span*avail;
      const w = Math.max(3, (e2 - s)/span*avail);
      const col = t.state==="active" ? "#22d3ee" : t.state==="waiting" ? "#fbbf24" : "#3f4c5c";
      html += `<div class="gbar" data-key="${esc(t.key)}" style="left:${left}px;width:${w}px;background:${col}"
        title="${esc(t.label)}">${w>54?esc(t.label.slice(0, Math.floor(w/6))):""}</div>`;
    });
    html += `</div>`;
  });
  const fmt = ms => new Date(ms).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  html += `<div class="gaxis"><span style="position:absolute;left:0">${fmt(from)}</span>
    <span style="position:absolute;left:50%;transform:translateX(-50%)">${fmt(from+span/2)}</span>
    <span style="position:absolute;right:0">现在</span></div></div>`;
  return html;
}

/* ---------------- 交互 ---------------- */
function bindNodeEvents(){
  nodeLayer.querySelectorAll(".card").forEach(el => {
    el.onmouseenter = ev => {
      const n = nodes.find(x => x.id === el.dataset.node);
      hover = { type:"node", id:n.id };
      showTip(ev, `<b>${esc(n.label)}</b><br>${n.sessions?n.sessions+" 个活跃会话":"空闲"}` +
        (n.stage?` · ${n.stage}`:"") + (n.cost_window?` · ${fmtCost(n.cost_window)}`:""));
    };
    el.onmouseleave = () => { hover = null; hideTip(); };
    el.onclick = ev => { ev.stopPropagation(); selected = {type:"node", id:el.dataset.node}; openPanel(); };
  });
}
function bindEdgeEvents(){
  svg.querySelectorAll(".edge-hit").forEach(el => {
    el.onmouseenter = ev => {
      const e = edges.find(x => x.id === el.dataset.edge);
      hover = {type:"edge", id:e.id};
      showTip(ev, `<b>${esc(e.label || (e.kind==="workspace"?"工作区读写":e.kind==="request"?"指令":"派活"))}</b>
        <br>${esc(e.a.label)} → ${esc(e.b.label)}<br>${stateName(e.state)}${e.stage?" · "+e.stage:""}${e.cost?" · "+fmtCost(e.cost):""}`);
    };
    el.onmouseleave = () => { hover = null; hideTip(); };
    el.onclick = ev => { ev.stopPropagation(); selected = {type:"edge", id:el.dataset.edge}; openPanel(); };
  });
}
document.addEventListener("click", () => closePanel());
function showTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = Math.min(innerWidth-440, ev.clientX+14)+"px";
  tip.style.top = Math.min(innerHeight-120, ev.clientY+14)+"px";
}
function hideTip(){ tip.style.opacity = 0; }

/* ---------------- 面板 ---------------- */
function openPanel(){ document.getElementById("panel").classList.add("open"); renderPanel(); }
function closePanel(){ selected = null; document.getElementById("panel").classList.remove("open"); renderNodes(); }
document.getElementById("p-close").onclick = ev => { ev.stopPropagation(); closePanel(); };
document.getElementById("panel").onclick = ev => ev.stopPropagation();

function stateName(s){ return s==="active"?"正在跑":s==="waiting"?"等我验收":"窗口内已结束"; }

function renderPanel(){
  if(!selected || !state) return;
  const t = document.getElementById("p-title"), s = document.getElementById("p-sub"), b = document.getElementById("p-body");
  if(selected.type === "node"){
    const n = nodes.find(x => x.id === selected.id); if(!n) return;
    t.textContent = n.label;
    s.textContent = `${n.role} · ${n.sessions?n.sessions+" 个活跃会话":"当前空闲"}`;
    const mine = edges.filter(e => e.from === n.id || e.to === n.id);
    b.innerHTML = `
      <div class="kv"><div class="k">忙碌度</div><div class="v">${Math.round((n.busy||0)*100)}%</div></div>
      <div class="kv"><div class="k">阶段</div><div class="v">${esc(n.stage||"—")}</div></div>
      <div class="kv"><div class="k">近 5 分钟</div><div class="v">${fmtTok(n.tokens_recent)} tok · ${fmtCost(n.cost_recent)}</div></div>
      <div class="kv"><div class="k">窗口内花费</div><div class="v">${fmtCost(n.cost_window)}</div></div>
      <div class="kv"><div class="k">说明</div><div class="v">${esc(n.note||"")}</div></div>
      <div class="sect">相关连接 ${mine.length}</div>` +
      mine.map(e => `<div class="kv"><div class="k"><span class="chip">${stateName(e.state)}</span></div>
        <div class="v">${esc(e.a.label)} → ${esc(e.b.label)}<br><span style="color:var(--muted)">${esc((e.label||e.kind).slice(0,70))}</span></div></div>`).join("");
  } else {
    const e = edges.find(x => x.id === selected.id); if(!e) return;
    const label = e.label || (e.kind==="workspace"?"工作区读写":e.kind==="request"?"指令":"派活");
    t.textContent = label.slice(0,40);
    s.innerHTML = `<span class="chip">${stateName(e.state)}</span>${esc(e.a.label)} → ${esc(e.b.label)}`;
    const dur = ((e.ended_at || state.generated_at) - e.started_at) * 1000;
    b.innerHTML = `
      <div class="kv"><div class="k">来源</div><div class="v">${e.evidence==="registry"
        ? '<span class="chip reg">登记</span>Hermes 派活时写入了登记文件'
        : e.evidence==="process" ? '<span class="chip inf">推定</span>按进程树推断（父进程）'
        : '<span class="chip inf">推定</span>无登记，按会话推断'}</div></div>
      <div class="kv"><div class="k">阶段</div><div class="v">${esc(e.stage||"—")}</div></div>
      <div class="kv"><div class="k">开始</div><div class="v">${e.started_at?new Date(e.started_at*1000).toLocaleString("zh-CN",{hour12:false}):"—"}</div></div>
      <div class="kv"><div class="k">耗时</div><div class="v">${e.started_at?fmtDur(dur):"—"}${e.state==="active"?" · 进行中":""}</div></div>
      <div class="kv"><div class="k">花费</div><div class="v">${fmtCost(e.cost)} <span style="color:var(--dim)">/ ${fmtTok(e.tokens)} tok</span></div></div>
      <div class="kv"><div class="k">项目</div><div class="v">${esc(e.project||"—")}</div></div>
      ${e.key?`<div class="sect">自己看</div>
        <pre>~/.hermes/scripts/worker_runs.py show ${esc(e.key)}</pre>
        ${e.log?`<pre>tail -f ${esc(e.log)}</pre>`:""}`:""}
      ${e.full?`<div class="sect">任务</div><div class="taskbox">${esc(e.full)}</div>`:""}`;
  }
}

/* ---------------- 数据 ---------------- */
let failStreak = 0;
async function poll(){
  try{
    const r = await fetch(`/api/state?window=${windowMin}`, {cache:"no-store"});
    state = await r.json(); failStreak = 0; errBox.style.display = "none";
    if(mode === "live") render();
  }catch(err){
    if(++failStreak >= 2){ errBox.style.display="block"; errBox.textContent="采集端断开（agent_flow.py 还活着吗？）"; }
  }
}
async function loadReplay(t){
  try{
    const r = await fetch(`/api/replay?t=${t}`, {cache:"no-store"});
    state = await r.json(); render();
  }catch(err){ errBox.style.display="block"; errBox.textContent="回放请求失败"; }
}

/* ---------------- 回放控制 ---------------- */
const scrub = document.getElementById("scrub");
const rpTime = document.getElementById("rp-time");
const SPAN = 24*3600;
function toT(v){ return Date.now()/1000 - SPAN + (v/1000)*SPAN; }
function fromT(t){ return Math.max(0, Math.min(1000, ((t - (Date.now()/1000 - SPAN))/SPAN)*1000)); }
scrub.disabled = false;
scrub.value = 1000;
scrub.oninput = () => {
  const t = toT(+scrub.value);
  mode = "replay"; replayT = t; stopPlay();
  rpTime.textContent = new Date(t*1000).toLocaleString("zh-CN",{hour12:false});
  loadReplay(t);
};
document.getElementById("btn-live").onclick = () => {
  mode = "live"; replayT = null; stopPlay(); scrub.value = 1000;
  rpTime.textContent = "实时"; document.getElementById("panel").classList.remove("open");
  selected = null; poll();
};
function stopPlay(){ playing = false; clearInterval(playTimer); playTimer = null;
  document.getElementById("btn-play").textContent = "▶ 播放"; }
document.getElementById("btn-play").onclick = () => {
  if(playing) return stopPlay();
  playing = true; document.getElementById("btn-play").textContent = "❚❚ 暂停";
  if(mode === "live"){ mode = "replay"; replayT = Date.now()/1000 - 3600; }
  playTimer = setInterval(() => {
    replayT = Math.min(Date.now()/1000, (replayT||0) + 60);
    scrub.value = fromT(replayT);
    rpTime.textContent = new Date(replayT*1000).toLocaleString("zh-CN",{hour12:false});
    loadReplay(replayT);
    if(replayT >= Date.now()/1000 - 2) stopPlay();
  }, 700);
};

/* ---------------- 窗口 / 启动 ---------------- */
const wins = document.getElementById("wins");
[5,15,30,60].forEach(m => {
  const b = document.createElement("button");
  b.textContent = m+"m"; b.className = m===windowMin?"on":"";
  b.onclick = () => { windowMin = m; [...wins.children].forEach(c => c.classList.remove("on")); b.classList.add("on"); poll(); };
  wins.appendChild(b);
});
window.addEventListener("resize", () => render());
window.addEventListener("keydown", e => {
  if(e.key === "Escape") closePanel();
  if(e.code === "Space"){ e.preventDefault(); document.getElementById("btn-play").click(); }
});
poll();
if(!STATIC) setInterval(() => { if(mode === "live") poll(); }, 2000);
</script>
</body>
